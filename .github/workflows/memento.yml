name: memento mori

on:
  schedule:
    # 03:07 UTC = 06:07 MSK — the countdown flips over early in the morning.
    - cron: '7 3 * * *'
  workflow_dispatch:
  push:
    paths:
      - 'memento.config.json'
      - 'scripts/memento.mjs'
      - '.github/workflows/memento.yml'

permissions:
  contents: write

concurrency:
  group: memento
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: node scripts/memento.mjs

      # Pushes made with GITHUB_TOKEN don't retrigger workflows, so the `push`
      # trigger above can't loop on this commit.
      - name: Commit the countdown
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/memento.svg readme.md
          git diff --staged --quiet && echo "nothing changed" && exit 0
          git commit -m "memento mori: $(date -u +%F)"
          git push
